<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PULSE 01 — SIGNAL · Nucleus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #05080a;
        overscroll-behavior: none;
      }
      .font-cinzel { font-family: 'Cinzel', serif; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fadeIn { animation: fadeIn 1.2s ease-out forwards; }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeInUp { animation: fadeInUp 0.9s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }

      @keyframes cardIn {
        0% { opacity: 0; transform: translateY(-14px) scale(0.97); }
        60% { opacity: 1; transform: translateY(2px) scale(1.01); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-cardIn { animation: cardIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards; }

      @keyframes nucleusPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; box-shadow: 0 0 30px 8px rgba(251, 191, 36, 0.25); }
        50% { transform: scale(1.12); opacity: 1; box-shadow: 0 0 60px 22px rgba(251, 191, 36, 0.45); }
      }
      .animate-nucleusPulse { animation: nucleusPulse 2.8s infinite ease-in-out; }

      @keyframes ping {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(2.6); opacity: 0; }
      }
      .animate-ping-ring { animation: ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite; }

      @keyframes badgeBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .animate-badgeBlink { animation: badgeBlink 1.1s infinite ease-in-out; }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-3px); }
        40% { transform: translateX(3px); }
        60% { transform: translateX(-2px); }
        80% { transform: translateX(2px); }
      }
      .animate-shake { animation: shake 0.35s ease-in-out; }

      @keyframes pulseOut {
        0% { transform: scale(0.4); opacity: 0.9; }
        100% { transform: scale(3.2); opacity: 0; }
      }
      .animate-pulseOut { animation: pulseOut 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }

      /* ---- Mailbox realism ---- */

      /* A new mail row pushing the list down, the way a real client does */
      @keyframes rowIn {
        0%   { opacity: 0; transform: translateY(-10px); max-height: 0; }
        45%  { opacity: 1; }
        100% { opacity: 1; transform: translateY(0); max-height: 140px; }
      }
      .animate-rowIn { animation: rowIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }

      /* The banner that drops from the top of the screen on arrival */
      @keyframes toastIn {
        0%   { opacity: 0; transform: translateY(-120%) scale(0.96); }
        18%  { opacity: 1; transform: translateY(6px) scale(1); }
        26%  { transform: translateY(0) scale(1); }
        88%  { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-120%) scale(0.98); }
      }
      .animate-toastIn { animation: toastIn 3.4s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }

      /* Someone is typing… */
      @keyframes typingDot {
        0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
        30%           { opacity: 1;    transform: translateY(-2px); }
      }
      .animate-typing1 { animation: typingDot 1.2s infinite ease-in-out; }
      .animate-typing2 { animation: typingDot 1.2s infinite ease-in-out 0.18s; }
      .animate-typing3 { animation: typingDot 1.2s infinite ease-in-out 0.36s; }

      /* Mail-client sync spinner in the header */
      @keyframes spin360 { to { transform: rotate(360deg); } }
      .animate-syncSpin { animation: spin360 0.9s linear infinite; }

      /* The unread counter flicking over */
      @keyframes countPop {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.35); }
        100% { transform: scale(1); }
      }
      .animate-countPop { animation: countPop 0.4s ease-out; }

      @keyframes slowGlow {
        0%, 100% { text-shadow: 0 0 12px rgba(251, 191, 36, 0.35); }
        50% { text-shadow: 0 0 28px rgba(251, 191, 36, 0.7); }
      }
      .animate-slowGlow { animation: slowGlow 3s infinite ease-in-out; }
    </style>
  </head>
  <body class="text-gray-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
