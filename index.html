<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PULSE 01 — SIGNAL · Nucleus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #06080B;
        overscroll-behavior: none;
      }
      .font-cinzel { font-family: 'Cinzel', serif; }

      /* Only the animations that run on their own live here. Anything whose
         timing follows the participant is driven by Motion for React instead —
         see components/atoms.tsx. */

      /* The nucleus breathes. It does not glow for attention. */
      @keyframes nucleusBreath {
        0%, 100% { transform: scale(1);    opacity: 0.65; box-shadow: 0 0 14px 2px rgba(251, 224, 165, 0.16); }
        50%      { transform: scale(1.14); opacity: 0.95; box-shadow: 0 0 22px 6px rgba(251, 224, 165, 0.26); }
      }
      .animate-nucleusBreath { animation: nucleusBreath 4.2s infinite ease-in-out; }

      @keyframes ping {
        0%   { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.9); opacity: 0; }
      }
      .animate-ping-ring { animation: ping 2.6s cubic-bezier(0, 0, 0.2, 1) infinite; }

      /* Round-1 chrome, replayed verbatim in Scene 13. */
      @keyframes badgeBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.45; }
      }
      .animate-badgeBlink { animation: badgeBlink 1.1s infinite ease-in-out; }

      @keyframes rowIn {
        0%   { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-rowIn { animation: rowIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }

      /* Someone is typing in the group, and nothing is being said. */
      @keyframes typingDot {
        0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
        30%           { opacity: 1;    transform: translateY(-2px); }
      }
      .animate-typing1 { animation: typingDot 1.2s infinite ease-in-out; }
      .animate-typing2 { animation: typingDot 1.2s infinite ease-in-out 0.18s; }
      .animate-typing3 { animation: typingDot 1.2s infinite ease-in-out 0.36s; }

      /* The mail client fetching, the way one does when you open it. */
      @keyframes spin360 { to { transform: rotate(360deg); } }
      .animate-syncSpin { animation: spin360 0.9s linear infinite; }

      @keyframes countPop {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.35); }
        100% { transform: scale(1); }
      }
      .animate-countPop { animation: countPop 0.4s ease-out; }
    </style>
  </head>
  <body class="text-gray-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
